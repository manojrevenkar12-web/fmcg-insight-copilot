[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fmcg-insight-copilot"
version = "1.0.0"
description = "Governed, explainable AI analytics for procurement, manufacturing and sales: dbt layers, a semantic KPI layer and a LangGraph insight agent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Manoj Kumar Prakash" }]
dependencies = [
  "duckdb>=1.3",
  "dbt-duckdb>=1.9",
  "pydantic>=2.8",
  "pyyaml>=6",
  "langgraph>=1.0",
  "langchain-core>=1.0",
  "langchain-openai>=1.0",
  "chromadb>=1.0",
  "rank-bm25>=0.2.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
insight = "insight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Long lines that remain after `ruff format` are SQL and regex literals; splitting them hurts readability.
ignore = ["E501"]
