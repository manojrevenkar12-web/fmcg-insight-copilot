name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, dbt build + tests, unit/API tests, evaluation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Lint and format
        run: ruff check . && ruff format --check .
      - name: Build data platform (landing → staging → quality → marts, dbt tests)
        run: insight build
      - name: Unit, integration and API tests
        run: pytest
      - name: Evaluation gate (golden set)
        run: python eval/run_eval.py --gate
      - name: Held-out report (informational, not a gate)
        run: python eval/run_eval.py --heldout
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: evaluation, path: eval/ }

  docker:
    name: Docker image builds and answers
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: insight-copilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name app -p 8000:8000 insight-copilot:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/readyz && break; sleep 1; done
          curl -sf -X POST localhost:8000/v1/ask -H 'X-API-Key: demo-analyst-key' -H 'content-type: application/json' \
            -d '{"question":"Which supplier had the worst OTIF last quarter?"}' | grep -q 'Baltic Agro'
